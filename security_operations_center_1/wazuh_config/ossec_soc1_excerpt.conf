<!-- Excerpt of the Wazuh manager ossec.conf used in the SOC 1 lab (Wazuh 4.9.2 single-node Docker).
     Email goes to a local MailHog test mailbox; nothing is sent outside the Mac. -->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>yes</email_notification>
    <smtp_server>mailhog</smtp_server>
    <email_from>wazuh-soc@hrmc.lab</email_from>
    <email_to>soc-tier1@hrmc.lab</email_to>
    <email_maxperhour>100</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>10</email_alert_level>
  </alerts>

  <!-- SOC 1: level 12+ alerts also go straight to the SOC lead (escalation) -->
  <email_alerts>
    <email_to>soc-lead@hrmc.lab</email_to>
    <level>12</level>
    <do_not_delay />
  </email_alerts>
  <!-- SOC 1 log source: Keycloak sign-in events -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/soc1/keycloak_login.json</location>
  </localfile>
  <!-- SOC 1 log source: Keycloak admin events -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/soc1/keycloak_admin.json</location>
  </localfile>
  <!-- SOC 1 log source: EHR access audit -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/soc1/ehr_access.json</location>
  </localfile>
  <!-- SOC 1 log source: Linux auth.log (sshd, sudo, PAM) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/soc1/auth.log</location>
  </localfile>
</ossec_config>
