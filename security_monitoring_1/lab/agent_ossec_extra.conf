<!-- SOC / Security Monitoring 1 additions -->
<ossec_config>
  <!-- container has no init system: do not self-restart on shared-config pushes -->
  <client>
    <auto_restart>no</auto_restart>
  </client>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <!-- network activity: established and pending outbound TCP connections, every 30 s -->
  <localfile>
    <log_format>full_command</log_format>
    <command>ss -Htn state established state syn-sent | awk '{print $4" -> "$5}' | sort</command>
    <alias>outbound_tcp</alias>
    <frequency>30</frequency>
  </localfile>
  <!-- file access: real-time integrity monitoring of the EHR export share -->
  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/srv/ehr_exports</directories>
  </syscheck>
</ossec_config>
