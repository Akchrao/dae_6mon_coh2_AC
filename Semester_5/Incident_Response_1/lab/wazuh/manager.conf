<!-- Appended to /var/ossec/etc/ossec.conf on the lab manager (Wazuh allows several ossec_config blocks).
     Agent traffic (1514/tcp) and enrollment (1515/tcp) are on by default in the manager image. -->
<ossec_config>
  <!-- macOS host DAEDMAC1009: files shipped from the Mac (a macOS agent needs admin rights to install) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/macos/install.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/macos/ssh_client.log</location>
  </localfile>
  <global>
    <logall_json>yes</logall_json>
  </global>
</ossec_config>
