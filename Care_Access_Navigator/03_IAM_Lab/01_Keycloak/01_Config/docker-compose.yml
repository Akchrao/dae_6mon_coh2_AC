# Project name pinned: the containers and the postgres_data volume were created as project
# care-access-navigator-iam-lab (the folder's old name). Without this line, `docker compose up`
# from this folder would start a new project with an EMPTY database.
name: care-access-navigator-iam-lab

services:
  postgres:
    image: postgres:16
    container_name: care-access-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: care-access-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
    ports:
      - "127.0.0.1:8080:8080"   # localhost only (CA-11)
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:



