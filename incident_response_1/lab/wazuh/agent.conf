<!-- Wazuh agent 4.9.2 on parrot-vm (Care Access Navigator IR1 shared lab). Installed to /var/ossec/etc/ossec.conf at provisioning.
     Collects the Parrot OS logs the IR1 rules use and watches the persistence paths with real-time FIM. -->
<ossec_config>
  <client>
    <server>
      <address>10.78.50.20</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>debian, debian12</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>30</time-reconnect>
    <auto_restart>yes</auto_restart>
    <enrollment>
      <enabled>yes</enabled>
      <agent_name>parrot-vm</agent_name>
    </enrollment>
  </client>
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- log collection (Parrot OS) -->
  <localfile><log_format>syslog</log_format><location>/var/log/auth.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/ehr-audit.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/kern.log</location></localfile>
  <localfile><log_format>syslog</log_format><location>/var/log/ir1-test.log</location></localfile>
  <localfile><log_format>audit</log_format><location>/var/log/audit/audit.log</location></localfile>

  <!-- file integrity monitoring: persistence and privilege paths, real time -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories realtime="yes">/home</directories>
    <directories realtime="yes">/var/spool/cron/crontabs</directories>
    <directories realtime="yes">/etc/sudoers.d</directories>
    <directories realtime="yes">/etc/ssh/sshd_config.d</directories>
  </syscheck>

  <!-- not used in this lab (CPU under emulation) -->
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
  <wodle name="cis-cat"><disabled>yes</disabled></wodle>
  <wodle name="osquery"><disabled>yes</disabled></wodle>
  <logging><log_format>plain</log_format></logging>
</ossec_config>
