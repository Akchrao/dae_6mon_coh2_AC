<!-- Appended to /var/ossec/etc/ossec.conf on the lab manager (Wazuh allows several ossec_config blocks).
     The three CDB lists are inserted into the existing <ruleset> block by run_lab.sh. -->
<ossec_config>
  <!-- Parrot OS: rsyslog on parrot-sim forwards auth/authpriv/local5 here (agentless syslog collection) -->
  <remote>
    <connection>syslog</connection>
    <port>514</port>
    <protocol>udp</protocol>
    <allowed-ips>10.77.0.0/24</allowed-ips>
  </remote>

  <!-- macOS host: files shipped from DAEDMAC1009 (a macOS agent needs admin rights to install) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/macos/install.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/macos/ssh_client.log</location>
  </localfile>

  <global>
    <logall_json>yes</logall_json>
  </global>
</ossec_config>
